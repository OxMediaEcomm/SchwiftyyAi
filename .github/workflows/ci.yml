name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: checks (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest] # macOS: see macos.yml
        node: [18, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Repo checks (paths, frontmatter, versions, Modelfile, install/uninstall)
        run: npm run check
      - name: Portal renders without a TTY
        run: node schwiftyy/portal.js
      - name: npm package contents
        run: npm pack --dry-run

  plugin:
    name: claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npx -y @anthropic-ai/claude-code plugin validate .
