<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Schwiftyy — a vibe-coding companion from Dimension C-420">
  <title>Schwiftyy — a vibe-coding companion from Dimension C-420</title>
  <defs>
    <radialGradient id="portal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eaffb0"/>
      <stop offset="35%" stop-color="#9dff3a"/>
      <stop offset="70%" stop-color="#2fbf3a"/>
      <stop offset="100%" stop-color="#0c3d14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7dff4f" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#7dff4f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05090a"/>
      <stop offset="100%" stop-color="#0b1a10"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1c3a22" stroke-width="1"/>
    </pattern>
    <style>
      .spin  { transform-origin: 300px 190px; animation: spin 9s linear infinite; }
      .spinr { transform-origin: 300px 190px; animation: spin 14s linear infinite reverse; }
      .pulse { transform-origin: 300px 190px; animation: pulse 3.2s ease-in-out infinite; }
      .bob   { animation: bob 4.2s ease-in-out infinite; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      .star  { animation: twinkle 2.6s ease-in-out infinite; }
      @keyframes spin   { to { transform: rotate(360deg); } }
      @keyframes pulse  { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      @keyframes bob    { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes blink  { 50% { opacity: 0; } }
      @keyframes twinkle{ 0%,100% { opacity: .15; } 50% { opacity: .9; } }
      @media (prefers-reduced-motion: reduce) {
        .spin, .spinr, .pulse, .bob, .blink, .star { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="380" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="18" fill="url(#grid)" opacity=".45"/>

  <!-- stars -->
  <g fill="#c8ff9a">
    <circle class="star" cx="620" cy="48" r="1.6"/>
    <circle class="star" cx="1110" cy="70" r="1.4" style="animation-delay:.8s"/>
    <circle class="star" cx="980" cy="330" r="1.8" style="animation-delay:1.4s"/>
    <circle class="star" cx="70" cy="320" r="1.5" style="animation-delay:.4s"/>
    <circle class="star" cx="760" cy="345" r="1.2" style="animation-delay:2s"/>
    <circle class="star" cx="1150" cy="220" r="1.3" style="animation-delay:1.1s"/>
  </g>

  <!-- portal -->
  <circle cx="300" cy="190" r="190" fill="url(#glow)"/>
  <g class="pulse">
    <ellipse cx="300" cy="190" rx="150" ry="140" fill="url(#portal)"/>
  </g>
  <g class="spin" fill="none" stroke-linecap="round">
    <path d="M300 60 a130 130 0 0 1 128 150" stroke="#d6ff8a" stroke-width="6" opacity=".8"/>
    <path d="M300 320 a130 130 0 0 1 -128 -150" stroke="#d6ff8a" stroke-width="6" opacity=".8"/>
    <path d="M300 95 a95 95 0 0 1 92 115" stroke="#effcd0" stroke-width="4" opacity=".7"/>
    <path d="M300 285 a95 95 0 0 1 -92 -115" stroke="#effcd0" stroke-width="4" opacity=".7"/>
  </g>
  <g class="spinr" fill="none" stroke-linecap="round">
    <path d="M190 120 a120 120 0 0 1 180 -20" stroke="#3fe05a" stroke-width="5" opacity=".75"/>
    <path d="M410 260 a120 120 0 0 1 -180 20" stroke="#3fe05a" stroke-width="5" opacity=".75"/>
    <path d="M240 150 a70 70 0 0 1 110 -10" stroke="#ffffff" stroke-width="3" opacity=".5"/>
    <path d="M360 230 a70 70 0 0 1 -110 10" stroke="#ffffff" stroke-width="3" opacity=".5"/>
  </g>

  <!-- Schwiftyy: a seven-leaflet leaf with eyes -->
  <g class="bob">
    <g transform="translate(300 225)" fill="#1f8f2e" stroke="#0a3a12" stroke-width="3">
      <ellipse rx="13" ry="62" transform="rotate(0) translate(0 -58)"/>
      <ellipse rx="12" ry="52" transform="rotate(-30) translate(0 -50)"/>
      <ellipse rx="12" ry="52" transform="rotate(30) translate(0 -50)"/>
      <ellipse rx="10" ry="40" transform="rotate(-62) translate(0 -40)"/>
      <ellipse rx="10" ry="40" transform="rotate(62) translate(0 -40)"/>
      <ellipse rx="8" ry="26" transform="rotate(-100) translate(0 -26)"/>
      <ellipse rx="8" ry="26" transform="rotate(100) translate(0 -26)"/>
      <path d="M0 0 L0 52" fill="none" stroke-width="5"/>
    </g>
    <!-- face -->
    <g transform="translate(300 170)">
      <circle cx="-11" cy="0" r="9" fill="#fff" stroke="#0a3a12" stroke-width="2"/>
      <circle cx="11" cy="0" r="9" fill="#fff" stroke="#0a3a12" stroke-width="2"/>
      <circle cx="-9" cy="2" r="3.2" fill="#111"/>
      <circle cx="13" cy="-1" r="3.2" fill="#111"/>
      <path d="M-13 -12 L-3 -9" stroke="#0a3a12" stroke-width="3" stroke-linecap="round"/>
      <path d="M-10 20 q10 7 22 -2" fill="none" stroke="#0a3a12" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- wordmark -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="520" y="148" font-size="88" font-weight="800" fill="#b6ff5a" letter-spacing="2">SCHWIFTYY</text>
    <text x="524" y="194" font-size="22" fill="#e9f7df">a vibe-coding companion for Claude Code</text>
    <text x="524" y="226" font-size="18" fill="#7fbf86">sentient leaf · Cannaboidian · Dimension C-420</text>
    <g transform="translate(524 262)">
      <rect width="560" height="54" rx="10" fill="#0a140c" stroke="#1f4a28"/>
      <text x="18" y="34" font-size="20" fill="#7fbf86">$</text>
      <text x="40" y="34" font-size="20" fill="#e9f7df">npx schwiftyy-cc@latest install</text>
      <rect class="blink" x="386" y="17" width="12" height="22" fill="#b6ff5a"/>
    </g>
  </g>
  <!-- if you're reading the SVG source: the portal does one full spin every 9 seconds. we tried 4.20 and Morty threw up. -->
</svg>
